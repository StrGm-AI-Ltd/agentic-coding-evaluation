spring:
  application.name: agentbench-jls
  sql.init.mode: always   # schema.sql is idempotent (IF NOT EXISTS); the DB is the record
  datasource:
    url: ${AB_JLS_DSN:jdbc:postgresql://localhost/agentbench}
    # the benchmark's own ports must stay free: 8080 is probed by the oracle, 9191 is the model server
server:
  port: ${AB_JLS_PORT:8765}

agentbench:
  model: ${AB_MODEL:Qwen3.6-27B-graft}
  endpoint: ${AB_ENDPOINT:http://127.0.0.1:9191/v1}
  api-key: ${OMLX_API_KEY:}
  temperature: 1.0
  top-p: 0.95
  max-output-tokens: 8192
  context-window: ${AB_CONTEXT_WINDOW:}   # EMPTY = no operator cap; the probe owns the window (Python default)
  keep-recent-turns: 8
  compaction-trigger: 28000
  results-dir: ${AB_RESULTS_DIR:./results}
  workspace-root: ${AB_WORKSPACE_ROOT:${java.io.tmpdir}/agentbench-jls-ws}
  poll-sec: 10
  max-error-rate: 0.2
  reference-server-port: 0     # 0 = the reference trading server stays off (the oracle starts it on demand)
  java-home: ${AB_JAVA_HOME:}
