server:
  # 8080 collides with the benchmark oracle, 9191 with oMLX, 8765 with agentbench-service itself.
  port: 8800

ace:
  service:
    # The Java/Spring/LangChain4j service from ace-service, run on a non-default
    # port/DB (ACE_JLS_PORT/ACE_JLS_DSN) precisely so it can coexist with the Python service instead of
    # colliding with it on 8765/agentbench. Was http://127.0.0.1:8765 (the Python FastAPI service).
    base-url: http://127.0.0.1:8765
