# Runs ace-service + ace-ui-vaadin as containers - the deployable counterpart of
# scripts/dev.sh's local launchd-based setup, same two services/ports/env vars.
#
# Local dev, build from source: docker compose up --build
# Deploy host (e.g. EC2): docker compose pull && docker compose up -d
#
# Both `image` and `build` are set per service on purpose: `--build` builds locally and tags the
# result with `image`, while a plain `pull`/`up` (no `--build`) fetches the pre-built image from
# ghcr.io instead - pushed there by .github/workflows/docker-publish.yml on every push to main.
# This keeps the deploy host from ever running the in-image Gradle + Vaadin-frontend build itself.
#

# DOCKER_GID (required): ace-service mounts the host's /var/run/docker.sock so DockerService.java
# can reach the host's real Docker daemon from inside the container (Docker-outside-of-Docker -
# this container never runs its own daemon). The appuser inside the container needs the socket's
# HOST group to actually read/write it. Find it with `stat -c '%g' /var/run/docker.sock` (Linux) on
# the actual deploy host, then either export DOCKER_GID before running compose, or put it in a
# .env file next to this one (DOCKER_GID=999). Get this wrong and every Docker-gated oracle check
# (B1/B2/C2/F5/F6/F7) silently reports "docker unavailable" and skips - the app still runs, it just
# quietly stops grading anything that needs a real build/compose check.
services:
  ace-service:
    image: ghcr.io/strgm-ai-ltd/ace-service:latest
    build:
      context: .
      dockerfile: ace-service/Dockerfile
    ports:
      - "8765:8765"
    environment:
      # unset here on purpose: this deployment runs exactly like a local setup with no oMLX
      # server reachable from it - Preflight will honestly report that, same as it would for
      # anyone running ace-service without a model server up. Jobs targeting an external
      # provider (Nebius, etc. - configured via the LLM Providers UI tab, stored in the DB on the
      # volume below) are unaffected either way.
      OMLX_API_KEY: ${OMLX_API_KEY:-}
      ACE_ENDPOINT: ${ACE_ENDPOINT:-}
      # everything that needs to survive a redeploy (the SQLite DB - including the LLM Providers
      # registry and its API keys - the results directory, and the workspace root) lives under
      # one mounted volume instead of the image's own ephemeral filesystem.
      ACE_JLS_DB_PATH: /app/data/db/ace-service.db
      ACE_RESULTS_DIR: /app/data/results
      ACE_WORKSPACE_ROOT: /app/data/workspaces
      # Preflight.java's "pinned JDK 21" check is a FATAL gate (WorkerService's own guard() -
      # it genuinely blocks every job, not just advisory UI) and falls back to macOS's
      # /usr/libexec/java_home when this is unset - which doesn't exist on this (Linux) image, so
      # every job would be refused forever without this. /opt/java/openjdk is eclipse-temurin's
      # own JAVA_HOME (confirmed inside the built image) - reusing it, not a new path to maintain.
      ACE_JAVA_HOME: /opt/java/openjdk
    volumes:
      - ace-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID}"
    restart: unless-stopped

  ace-ui-vaadin:
    image: ghcr.io/strgm-ai-ltd/ace-ui-vaadin:latest
    build:
      context: .
      dockerfile: ace-ui-vaadin/Dockerfile
    ports:
      # ACE_UI_PORT only matters for a plain-HTTP deploy with no Caddy in front (or local dev,
      # where it defaults to 8800, same as scripts/dev.sh - never needs root to bind). With Caddy
      # below handling 80/443, this container's own host port is never reached directly from the
      # internet - Caddy talks to it over the compose-internal network by service name instead.
      - "${ACE_UI_PORT:-8800}:8800"
    environment:
      # compose's own service-name DNS - the two containers share this network by default
      ACE_SERVICE_BASE_URL: http://ace-service:8765
    depends_on:
      - ace-service
    restart: unless-stopped

  # Reverse proxy + automatic HTTPS (Let's Encrypt, auto-renewed) for the domain in ./Caddyfile.
  # Needs that domain's DNS already pointed at this host before it can complete the ACME HTTP-01
  # challenge on port 80 - starting this before DNS propagates just means the first cert request
  # fails; Caddy retries on its own once DNS catches up, no restart needed.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    extra_hosts:
      # Linux doesn't define host.docker.internal by default the way Docker Desktop does - this is
      # what lets the omlx.strgm-ai.com site block in ./Caddyfile reach the SSH reverse tunnel
      # landing on the HOST's own port 9191 (not this container's own, unrelated loopback).
      - "host.docker.internal:host-gateway"
    depends_on:
      - ace-ui-vaadin
    restart: unless-stopped

volumes:
  ace-data:
  caddy-data:
