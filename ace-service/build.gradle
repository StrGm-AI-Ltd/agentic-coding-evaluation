buildscript {
    repositories { mavenCentral() }
    // used only by prepareJooqSchema below, to materialise V1__init.sql into a scratch SQLite file
    // that the jOOQ generator then introspects - lighter than pulling Flyway itself onto the
    // buildscript classpath just to run one plain-SQL migration file.
    dependencies { classpath 'org.xerial:sqlite-jdbc:3.47.1.0' }
}

plugins {
    id 'java'
    // Spring Boot version is pinned once in gradle/libraries.toml and referenced here - the BOM import
    // below resolves the same entry, so the plugin and dependency management can never desync.
    alias(libs.plugins.springBoot)
    id 'nu.studer.jooq' version '9.0'
}

group = 'com.strgmai.ace.service'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation platform('dev.langchain4j:langchain4j-bom:1.20.0')
    implementation platform("org.springframework.boot:spring-boot-dependencies:${libs.versions.springBoot.get()}")
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // starter-jooq pulls jOOQ + spring-boot-starter-jdbc and auto-configures a DSLContext from the
    // DataSource; queries use the generated table/field classes below (jOOQ code generation against
    // the real SQLite schema, not hand-declared DSL.table() references).
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'dev.langchain4j:langchain4j'
    implementation 'dev.langchain4j:langchain4j-open-ai'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.xerial:sqlite-jdbc:3.47.1.0'
    implementation 'com.openai:openai-java:4.65.0'
    jooqGenerator 'org.xerial:sqlite-jdbc:3.47.1.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // core Testcontainers (GenericContainer/ImageFromDockerfile/Wait/MountableFile/DockerClientFactory)
    // for DockerApplicationIT, which builds and runs THIS app's own Docker image - unrelated to which
    // database the app uses, so this stays even though org.testcontainers:postgresql is gone.
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:junit-jupiter'
}

// jOOQ codegen needs a real database to introspect. The migrations are plain SQL (no Flyway-specific
// syntax), so they are just executed directly against a fresh scratch file, in Flyway's own V<N>__
// filename order - one statement at a time, since the sqlite-jdbc driver's Statement.execute() does
// not reliably run a whole ;-separated script.
def jooqSchemaDb = layout.buildDirectory.file('jooq/schema.db')
def migrationDir = file('src/main/resources/db/migration')
tasks.register('prepareJooqSchema') {
    inputs.dir(migrationDir)
    outputs.file(jooqSchemaDb)
    doLast {
        def dbFile = jooqSchemaDb.get().asFile
        dbFile.parentFile.mkdirs()
        dbFile.delete()
        // DriverManager.getConnection() can fail to see this driver here ("no suitable driver") -
        // the buildscript classloader that loaded org.sqlite.JDBC is not necessarily the one
        // DriverManager's service-loader lookup runs under from a task action. Instantiating the
        // driver directly and calling connect() sidesteps that classloader-visibility check entirely.
        def driver = (java.sql.Driver) Class.forName('org.sqlite.JDBC').getDeclaredConstructor().newInstance()
        def conn = driver.connect("jdbc:sqlite:${dbFile.absolutePath}", new Properties())
        try {
            def stmt = conn.createStatement()
            def migrations = migrationDir.listFiles({ f -> f.name.endsWith('.sql') } as FileFilter).sort { it.name }
            for (def migration : migrations) {
                // strip line comments FIRST: a comment containing its own ';' (plain English prose does)
                // would otherwise split one CREATE TABLE into two incomplete fragments.
                def noComments = migration.text.readLines().collect { line ->
                    def idx = line.indexOf('--')
                    idx < 0 ? line : line.substring(0, idx)
                }.join('\n')
                for (def s : noComments.split(';')) {
                    def trimmed = s.trim()
                    if (!trimmed.isEmpty()) stmt.executeUpdate(trimmed)
                }
            }
        } finally { conn.close() }
    }
}

jooq {
    version = '3.19.15'
    configurations {
        main {
            // wires generateJooq as a real dependency of compileJava (and thus bootJar etc.), not
            // just something you happen to have run before. Without this, a clean checkout - or the
            // Docker build's probe stage - never triggers codegen at all, and compilation fails with
            // "package com.strgmai.ace.service.jooq does not exist" the first time round.
            generateSchemaSourceOnCompilation = true
            generationTool {
                jdbc {
                    driver = 'org.sqlite.JDBC'
                    url = "jdbc:sqlite:${jooqSchemaDb.get().asFile.absolutePath}"
                }
                generator {
                    name = 'org.jooq.codegen.JavaGenerator'
                    database { name = 'org.jooq.meta.sqlite.SQLiteDatabase' }
                    target {
                        packageName = 'com.strgmai.ace.service.jooq'
                        directory = 'build/generated-src/jooq/main'
                    }
                }
            }
        }
    }
}
tasks.named('generateJooq') { dependsOn 'prepareJooqSchema' }

tasks.named('test', Test) {
    useJUnitPlatform { excludeTags 'docker' }   // dockerTest below runs these instead - building an image is slow
    // the agent's bash tool runs zsh; keep the environment minimal in tests as the harness does. Scoped to
    // this task only: withType(Test) would also leak CI=1 into dockerTest and any future Test task, and
    // libraries that branch on CI (e.g. testcontainers pull/reuse logic) would change behaviour unexpectedly.
    environment 'CI', '1'
}

tasks.register('dockerTest', Test) {
    group = 'verification'
    description = "Functional test: builds this app's own Dockerfile into a real image and hits its HTTP API " +
            "from outside. Slow (a full image build) and needs a running Docker daemon - not part of `test`."
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'docker' }
}

// A backstop, not the primary cleanup path: SelftestIT's own oracle already tears its stacks down
// itself (ComposeChecks.run()'s finally block, --rmi local), and DockerApplicationIT removes its
// built image in @AfterAll. Neither runs if the test JVM is killed first - a Gradle test timeout,
// an OOM, ctrl-C - so this exists for exactly that case: finalizedBy still fires because Gradle
// itself (not the forked test JVM) survives those.
abstract class DockerCleanupTask extends DefaultTask {
    @javax.inject.Inject abstract org.gradle.process.ExecOperations getExecOps()

    // Gradle's ExecOperations does not resolve a bare "docker" against PATH the way ProcessBuilder
    // (what DockerService.proc/sh use elsewhere) does - on this machine it fails with ENOENT even
    // though /usr/local/bin/docker exists and `docker` works fine from any shell. Resolve an
    // absolute path ourselves, same candidate list DockerService.dockerTools already checks.
    static String dockerBinary() {
        for (String p : ['/usr/local/bin/docker', '/opt/homebrew/bin/docker',
                          '/Applications/Docker.app/Contents/Resources/bin/docker']) {
            if (new File(p).canExecute()) return p
        }
        return 'docker'   // fall back to PATH lookup in case none of the above match
    }

    @TaskAction
    void run() {
        String docker = dockerBinary()
        def ls = new ByteArrayOutputStream()
        execOps.exec { commandLine docker, 'compose', 'ls', '-a', '--format', 'json'; standardOutput = ls; ignoreExitValue = true }
        def projects = ls.toString().isBlank() ? [] : new groovy.json.JsonSlurper().parseText(ls.toString())
        projects.findAll { it.Name ==~ /ab\d+/ }.each { p ->
            execOps.exec { commandLine docker, 'compose', '-p', p.Name, 'down', '-v', '--remove-orphans', '--rmi', 'local'; ignoreExitValue = true }
        }
        execOps.exec { commandLine docker, 'image', 'prune', '-f'; ignoreExitValue = true }
    }
}
tasks.register('dockerCleanup', DockerCleanupTask) {
    group = 'verification'
    description = 'Removes docker-compose stacks and images a killed/timed-out dockerTest run left behind.'
}
tasks.named('dockerTest') { finalizedBy 'dockerCleanup' }
