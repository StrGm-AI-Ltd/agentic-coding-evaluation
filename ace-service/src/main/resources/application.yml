spring:
  application.name: ace-service
  # Flyway (src/main/resources/db/migration/V1__init.sql) owns the schema now; spring.flyway.enabled
  # defaults to true once flyway-core is on the classpath, so nothing to set here.
  datasource:
    url: jdbc:sqlite:${ACE_JLS_DB_PATH:./ace-service.db}?foreign_keys=on&journal_mode=WAL&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1   # SQLite serializes writers; one pooled connection avoids SQLITE_BUSY under this service's own concurrent access
    # the benchmark's own ports must stay free: 8080 is probed by the oracle, 9191 is the model server
server:
  port: ${ACE_JLS_PORT:8765}

ace:
  model: ${ACE_MODEL:Qwen3.6-27B-graft}
  endpoint: ${ACE_ENDPOINT:http://127.0.0.1:9191/v1}
  api-key: ${OMLX_API_KEY:}
  temperature: 1.0
  top-p: 0.95
  max-output-tokens: 131072   # half of the default context window (262144, RunBench.java's no-probe fallback)
  context-window: ${ACE_CONTEXT_WINDOW:}   # EMPTY = no operator cap; the probe owns the window (Python default)
  keep-recent-turns: 8
  compaction-trigger: 28000
  results-dir: ${ACE_RESULTS_DIR:./results}
  workspace-root: ${ACE_WORKSPACE_ROOT:${java.io.tmpdir}/ace-service-ws}
  poll-sec: 10
  docker-gc:
    interval-sec: 3600   # #621: periodic `docker container/image/volume prune -f` - never touches anything still in use
  max-error-rate: 0.2
  # Operational settings (OperationsProperties): they depend on the machine and on how ACE is run, not on the
  # benchmark. The harness's limits and thresholds stay in the code, versioned by HARNESS_VERSION.
  operations:
    stream-idle-timeout-sec: 1800          # abandon a model stream with no new output for 30 minutes
    stream-poll-ms: 2000                   # how often a call waiting on the model checks for cancellation and idleness
    gradle-timeout-sec: 2400               # the oracle's Gradle build and test steps
    proxy-timeout-margin-sec: 30           # added to a job's first-token timeout for the proxy's upstream wait
    docker-sidecar-ready-timeout-sec: 60   # a job's Docker sidecar answering on its port
    transcript-tail-cap-chars: 20000       # the task transcript a transcript request returns
    request-speed-window-tolerance-sec: 1800   # a request outside an attempt's window still counts for its speeds
    judge-stamp-tolerance-sec: 300         # a judge verdict outside an attempt's window still counts for it
    stuck-worker-threshold-sec: 1800       # a busy worker that logs nothing for this long is presumed wedged
  java-home: ${ACE_JAVA_HOME:}
  omlx-server-log: ${ACE_OMLX_SERVER_LOG:}   # EMPTY = no capture; the model server's own log (path is operator/machine-specific)
  # per-phase operator-wide defaults, keyed by phase id (p0_definition/p1_plan/p2_implementation/
  # implement); unset means unlimited, same "0 = no budget" convention as every other budget here.
  # A run's own --impl-wall/--impl-tokens overrides these for the implementation phase specifically.
  # phase-wall-sec:
  #   p1_plan: 900
  # phase-token-budgets:
  #   p1_plan: 20000
