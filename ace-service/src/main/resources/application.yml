spring:
  application.name: ace-service
  # Flyway (src/main/resources/db/migration/V1__init.sql) owns the schema now; spring.flyway.enabled
  # defaults to true once flyway-core is on the classpath, so nothing to set here.
  datasource:
    url: jdbc:sqlite:${ACE_JLS_DB_PATH:./ace-service.db}?foreign_keys=on&journal_mode=WAL&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1   # SQLite serializes writers; one pooled connection avoids SQLITE_BUSY under this service's own concurrent access
    # the benchmark's own ports must stay free: 8080 is probed by the oracle, 9191 is the model server
server:
  port: ${ACE_JLS_PORT:8765}

ace:
  model: ${ACE_MODEL:Qwen3.6-27B-graft}
  endpoint: ${ACE_ENDPOINT:http://127.0.0.1:9191/v1}
  api-key: ${OMLX_API_KEY:}
  temperature: 1.0
  top-p: 0.95
  max-output-tokens: 8192
  context-window: ${ACE_CONTEXT_WINDOW:}   # EMPTY = no operator cap; the probe owns the window (Python default)
  keep-recent-turns: 8
  compaction-trigger: 28000
  results-dir: ${ACE_RESULTS_DIR:./results}
  workspace-root: ${ACE_WORKSPACE_ROOT:${java.io.tmpdir}/ace-service-ws}
  poll-sec: 10
  max-error-rate: 0.2
  reference-server-port: 0     # 0 = the reference trading server stays off (the oracle starts it on demand)
  java-home: ${ACE_JAVA_HOME:}
