services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: bench, POSTGRES_PASSWORD: bench, POSTGRES_DB: bench}
    healthcheck: {test: ['CMD', 'pg_isready', '-U', 'bench'], interval: 5s}
  account-service:
    build: {context: ., dockerfile: account-service/Dockerfile}
    ports: ['8080:8080']
    depends_on: {db: {condition: service_healthy}}
    healthcheck: {test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health'], interval: 5s}
