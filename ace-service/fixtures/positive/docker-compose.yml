services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 5s
      timeout: 3s
      retries: 20

  account-service:
    build: {context: ., dockerfile: account-service/Dockerfile}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/trading
      SPRING_DATASOURCE_USERNAME: trading
      SPRING_DATASOURCE_PASSWORD: trading
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  market-service:
    build: {context: ., dockerfile: market-service/Dockerfile}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  gateway:
    build: {context: ., dockerfile: gateway/Dockerfile}
    ports: ["8080:8080"]
    environment:
      ACCOUNT_URL: http://account-service:8081
      MARKET_URL: http://market-service:8082
    depends_on:
      account-service: {condition: service_healthy}
      market-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  web:
    build: ./web
    ports: ["3000:80"]
    depends_on:
      gateway: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
