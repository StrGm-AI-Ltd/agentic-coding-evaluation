name: Publish Docker images

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ace-service/Dockerfile
          push: true
          tags: ghcr.io/strgm-ai-ltd/ace-service:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ace-ui-vaadin/Dockerfile
          push: true
          tags: ghcr.io/strgm-ai-ltd/ace-ui-vaadin:latest
